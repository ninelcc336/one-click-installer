[package]
name = "codex-cc-switch-installer"
version = "0.1.0"
description = "Codex 与 CC Switch 一键安装器"
authors = ["Codex Installer Team"]
edition = "2021"

[lib]
name = "codex_cc_switch_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2.0.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
